name: PR CI

on:
  pull_request:
    paths:
      - "packages/py-zygo/**"
      - ".github/workflows/pr-ci.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/py-zygo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.46.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run quality checks
        run: just check

      - name: Run tests
        run: just test
