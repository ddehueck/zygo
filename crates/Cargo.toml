[workspace]
members = [
    "core",
    "cli",
    "testing",
    "local",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Devin <devin@dehueck.com>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.41.0", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0.100"
thiserror = "2.0.20"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
uuid = { version = "1.11.0", features = ["v5", "v7"] }
