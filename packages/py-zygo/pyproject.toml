[project]
name = "zygo"
version = "0.1.0"
description = "A modern python workflow engine for bioinformatics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.7.0",
    "pathspec>=1.1.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
]


[dependency-groups]
dev = [
    "pillow>=11.0.0",
    "datamodel-code-generator>=0.82.0,<0.83.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.4",
    "ty>=0.0.8",
    "pyarrow-stubs>=20.0.0.20260819",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Based on: https://github.com/Ranteck/PyStrict-strict-python/blob/develop/pyproject.toml
# ============================================================
# RUFF CONFIGURATION - MAXIMUM STRICTNESS
# ============================================================
[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
fix = true
show-fixes = true
preview = true  # Enable preview rules (PLR1702, etc.)

[tool.ruff.lint]
# Comprehensive rule set for strict checking
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except (no bare except:)
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "T20",    # flake8-print (no print statements)
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "Q",      # flake8-quotes
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint (includes PLR1702: too-many-nested-blocks)
    "PERF",   # perflint (performance)
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "FBT",    # flake8-boolean-trap (no boolean positional args)
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
]

ignore = [
    "E501",    # Line too long (formatter handles this)
    "S603",    # subprocess without shell=True (too strict)
    "S607",    # Starting a process with a partial path (too strict)
    "PLC2701", # We intentionally import the _internal package for internal use only
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["zygo.Depends", "zygo.Input", "zygo.Output",]

# Complexity limits (anti-LLM-slop)
[tool.ruff.lint.mccabe]
max-complexity = 10  # Maximum cyclomatic complexity

[tool.ruff.lint.pylint]
max-nested-blocks = 3  # Maximum nested block depth (PLR1702)

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"src/zygo/cli/v0/generated.py" = ["ERA001"]
"__init__.py" = [
    "F401",    # Allow unused imports in __init__.py
]
"tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "PLR2004", # Allow magic values in tests
    "ANN",     # Don't require annotations in tests
    "FBT",     # Allow boolean args in tests
]

[tool.ruff.lint.isort]
known-first-party = ["zygo"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================
# TY CONFIGURATION
# ty has no strict-mode switch. Its defaults already cover most of
# the old basedpyright errors (bad overrides, missing imports,
# optional misuse). Rules below are the ones that map onto checks
# that preset turned up past ty's defaults.
# ============================================================
[tool.ty.environment]
python-version = "3.12"
# src is the import root so checks match the published package.
# "." keeps project-level modules (tests, examples) resolvable.
root = ["src", "."]

[tool.ty.rules]
deprecated = "warn"
missing-override-decorator = "error"
missing-type-argument = "error"
redundant-cast = "error"
redundant-condition = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
